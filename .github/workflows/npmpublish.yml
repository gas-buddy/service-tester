name: Node.js Package

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          yarn config set npmScopes.gasbuddy.npmRegistryServer "https://registry.npmjs.org"
          yarn config set npmScopes.gasbuddy.npmAlwaysAuth true
          yarn config set npmScopes.gasbuddy.npmAuthToken $NPM_AUTH_TOKEN
          yarn install --immutable
        env:
          NPM_AUTH_TOKEN: ${{secrets.npm_token}}
      - run: yarn lint
      - run: yarn test --coverage
      - run: yarn build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          yarn config set npmScopes.gasbuddy.npmRegistryServer "https://registry.npmjs.org"
          yarn config set npmScopes.gasbuddy.npmAlwaysAuth true
          yarn config set npmScopes.gasbuddy.npmAuthToken $NPM_AUTH_TOKEN
          yarn install --immutable
        env:
          NPM_AUTH_TOKEN: ${{secrets.npm_token}}
      - run: yarn build
      # OIDC trusted publishing requires npm's own engines floor (>=20.17.0 || >=22.9.0);
      # bumped only this step's Node, not the build job above.
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Publish to NPM
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NPM_TAG=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          echo "Publishing $VERSION with dist-tag: $NPM_TAG"
          npx -y npm@11.19.0 publish --access public --tag "$NPM_TAG"

